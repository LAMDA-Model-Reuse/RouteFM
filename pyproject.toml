[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "routefm-router"
version = "1.0.0"
description = "Pretrained in-context model routing with Qwen and BGE encoders"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
classifiers = ["License :: OSI Approved :: Apache Software License"]
dependencies = ["torch>=2.1", "numpy>=1.24", "pandas>=2.0", "PyYAML>=6.0"]

[project.optional-dependencies]
bge = ["transformers>=4.40"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["routefm*"]

[project.scripts]
routefm-predict = "routefm.predict:main"
routefm-eval-small = "routefm.mmrbench:main_small"
routefm-eval-large = "routefm.mmrbench:main_large"
routefm-make-splits = "routefm.splits:main"
routefm-train = "routefm.training.unified_scratch:main"
routefm-prepare-data = "routefm.prepare_data:main"
routefm-embed-qwen = "routefm.embed_qwen:main"
routefm-embed-bge = "routefm.embed_bge:main"
