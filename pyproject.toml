[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "routefm-router"
version = "1.1.0"
description = "Pretrained in-context model routing with Qwen and BGE encoders"
readme = "PYPI.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
  {name = "Guannan Lai"},
  {name = "Han-Jia Ye"},
]
keywords = [
  "foundation model",
  "language model routing",
  "LLM routing",
  "model selection",
  "multimodal routing",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "torch>=2.1",
  "numpy>=1.24",
  "pandas>=2.0",
  "PyYAML>=6.0",
  "huggingface_hub>=0.26",
  "safetensors>=0.4",
]

[project.optional-dependencies]
bge = ["transformers>=4.40,<6"]

[project.urls]
Homepage = "https://github.com/LAMDA-Model-Reuse/RouteFM"
Paper = "https://arxiv.org/abs/2609.37362"
Models = "https://huggingface.co/AIGNLAI/RouteFM"
Issues = "https://github.com/LAMDA-Model-Reuse/RouteFM/issues"
Changelog = "https://github.com/LAMDA-Model-Reuse/RouteFM/releases"

[tool.setuptools.packages.find]
where = ["src"]
include = ["routefm*"]

[project.scripts]
routefm-predict = "routefm.predict:main"
routefm-eval-small = "routefm.mmrbench:main_small"
routefm-eval-large = "routefm.mmrbench:main_large"
routefm-make-splits = "routefm.splits:main"
routefm-train = "routefm.training.unified_scratch:main"
routefm-prepare-data = "routefm.prepare_data:main"
routefm-embed-qwen = "routefm.embed_qwen:main"
routefm-embed-bge = "routefm.embed_bge:main"
routefm-download = "routefm.download:main"
